server {
  listen 80;
  index index.html;
  server_tokens off;

  # Фотографии котиков приходят в base64 внутри JSON —
  # увеличиваем допустимый размер тела запроса (по умолчанию 1 МБ).
  client_max_body_size 20M;

  # API бэкенда
  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/api/;
  }

  # Админка Django
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:8000/admin/;
  }

  # Файлы, загруженные пользователями (volume media)
  location /media/ {
    alias /media/;
  }

  # Фронтенд и статика (volume static):
  # /static/index.html, /static/static/js, /static/static/css,
  # /static/static/admin, /static/static/rest_framework
  location / {
    alias /static/;
    try_files $uri $uri/ /index.html;
  }
}
